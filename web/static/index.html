<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DL Debugger Chat</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d7dee8;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --accent: #7c3aed;
      --warn: #b45309;
      --danger: #b42318;
      --good-bg: #e8f7f1;
      --note-bg: #eef2ff;
      --warn-bg: #fff7ed;
      --shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #edf7f4 0, rgba(237, 247, 244, 0) 260px),
        var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 4px 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: 0;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: right;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .toggle-problems {
      min-height: 36px;
      padding: 0 11px;
    }

    .chat-shell {
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr;
    }

    .problem-panel {
      display: grid;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
      padding: 12px;
    }

    .problem-controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(180px, 240px);
      gap: 10px;
      align-items: end;
    }

    .problem-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .problem-field label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .problem-meta {
      color: var(--muted);
      font-size: 0.82rem;
      min-height: 18px;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 11px;
      color: var(--ink);
      font: inherit;
      background: white;
    }

    .problem-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .problem-option {
      display: grid;
      gap: 5px;
      align-content: start;
      min-height: 78px;
      height: auto;
      width: 100%;
      padding: 10px;
      white-space: normal;
      text-align: left;
      color: var(--ink);
      background: var(--surface-soft);
      border-color: var(--line);
      font-weight: 400;
    }

    .problem-option:hover,
    .problem-option.active {
      border-color: var(--brand);
      background: #edf7f4;
    }

    .problem-category {
      color: var(--brand-dark);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .problem-text {
      overflow-wrap: anywhere;
    }

    .problem-empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--surface-soft);
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      min-height: 320px;
      max-height: clamp(320px, calc(100vh - 430px), 520px);
      padding: 18px;
      scroll-behavior: smooth;
    }

    .message {
      display: grid;
      gap: 8px;
      max-width: min(760px, 100%);
    }

    .message.user {
      align-self: end;
      justify-items: end;
    }

    .message.assistant {
      align-self: start;
      justify-items: start;
    }

    .bubble {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      max-width: 100%;
      overflow-wrap: anywhere;
      background: var(--surface-soft);
    }

    .user .bubble {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .assistant .bubble {
      background: white;
    }

    .meta {
      color: var(--muted);
      font-size: 0.82rem;
      padding: 0 2px;
    }

    .answer {
      display: grid;
      gap: 12px;
      width: min(760px, 100%);
    }

    .answer-section {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .answer-section h2 {
      margin: 0;
      font-size: 0.94rem;
      letter-spacing: 0;
    }

    .summary-text {
      margin: 0;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 5px 8px;
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }

    .chip.cause {
      background: var(--note-bg);
      border-color: #c7d2fe;
    }

    .chip.recommendation {
      background: var(--good-bg);
      border-color: #b7e4d2;
    }

    .chip.warn {
      background: var(--warn-bg);
      border-color: #fed7aa;
    }

    .list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .evidence-grid,
    .confidence-grid {
      display: grid;
      gap: 8px;
    }

    .evidence-item {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }

    .confidence-item {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 130px;
      gap: 10px;
      align-items: center;
    }

    .bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }

    .muted {
      color: var(--muted);
    }

    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 10px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
      padding: 10px;
    }

    .mode-tabs {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--brand);
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    .mode-tabs button {
      flex: 1;
      min-height: 52px;
      border: 0;
      border-radius: 0;
      padding: 0 12px;
      color: var(--brand-dark);
      background: white;
    }

    .mode-tabs button.active {
      color: white;
      background: var(--brand);
    }

    .file-picker {
      display: flex;
      align-items: center;
      min-height: 52px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: white;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .file-picker input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .hidden {
      display: none;
    }

    textarea {
      width: 100%;
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      font: inherit;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus {
      outline: 3px solid rgba(15, 118, 110, 0.24);
      outline-offset: 2px;
    }

    button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 14px;
      color: white;
      background: var(--brand);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    button.secondary {
      color: var(--brand-dark);
      background: white;
      border-color: var(--brand);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    @media (max-width: 720px) {
      .app {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        text-align: left;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .messages {
        min-height: 300px;
        max-height: clamp(300px, calc(100vh - 520px), 420px);
        padding: 14px;
      }

      .problem-controls {
        grid-template-columns: 1fr;
      }

      .problem-list {
        grid-template-columns: 1fr;
        max-height: 260px;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .top-actions button {
        width: auto;
      }

      .evidence-item,
      .confidence-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">DL</div>
        <h1>DL Debugger Chat</h1>
      </div>
      <div class="top-actions">
        <div id="status" class="status">Ready</div>
        <button
          id="toggle-problems"
          class="secondary toggle-problems"
          type="button"
          aria-controls="problem-panel"
          aria-expanded="true"
        >Hide problems</button>
      </div>
    </header>

    <section id="problem-panel" class="problem-panel" aria-label="Known problem picker">
      <div class="problem-controls">
        <div class="problem-field">
          <label for="problem-search">Search known problems</label>
          <input
            id="problem-search"
            type="search"
            placeholder="Search by loss, validation, transformer, gpu..."
            autocomplete="off"
          >
        </div>
        <div class="problem-field">
          <label for="problem-category">Category</label>
          <select id="problem-category">
            <option value="">All categories</option>
          </select>
        </div>
      </div>
      <div id="problem-count" class="problem-meta">Loading problem options</div>
      <div id="problem-list" class="problem-list" role="listbox" aria-label="Known problems"></div>
    </section>

    <section class="chat-shell" aria-label="Diagnosis chat">
      <div id="messages" class="messages" aria-live="polite"></div>
    </section>

    <form id="composer" class="composer">
      <div class="mode-tabs" role="tablist" aria-label="Input mode">
        <button class="active" type="button" data-mode="text">Text</button>
        <button type="button" data-mode="csv">CSV</button>
      </div>
      <textarea
        id="prompt"
        name="prompt"
        rows="2"
        placeholder="training loss is high and validation accuracy keeps dropping"
        autocomplete="off"
      ></textarea>
      <label id="csvPicker" class="file-picker hidden">
        <input id="csvFile" type="file" accept=".csv,text/csv">
        <span id="csvName">Select CSV</span>
      </label>
      <button id="send" type="submit">Send</button>
      <button id="clear" class="secondary" type="button">Clear</button>
    </form>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("composer");
    const prompt = document.getElementById("prompt");
    const problemPanel = document.getElementById("problem-panel");
    const problemSearch = document.getElementById("problem-search");
    const problemCategory = document.getElementById("problem-category");
    const problemCount = document.getElementById("problem-count");
    const problemList = document.getElementById("problem-list");
    const toggleProblemsButton = document.getElementById("toggle-problems");
    
    const csvPicker = document.getElementById("csvPicker");
    const csvFile = document.getElementById("csvFile");
    const csvName = document.getElementById("csvName");
    
    const sendButton = document.getElementById("send");
    const clearButton = document.getElementById("clear");
    const status = document.getElementById("status");
    let problemOptions = [];
    let currentProblemMatches = [];
    let selectedProblemId = "";
    let selectedProblemText = "";

    const modeButtons = [...document.querySelectorAll("[data-mode]")];
    let inputMode = "text";

    function label(name) {
      if (!name) {
        return "";
      }
      return String(name).replace(/([a-z])([A-Z])/g, "$1 $2");
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    function appendMessage(role, body) {
      const wrapper = document.createElement("article");
      wrapper.className = `message ${role}`;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "user" ? "You" : "DL Debugger";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (typeof body === "string") {
        bubble.textContent = body;
      } else {
        bubble.appendChild(body);
      }

      wrapper.append(meta, bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
      return wrapper;
    }

    function normalizeResponse(payload) {
      const diagnosis = payload.result || payload.diagnosis || payload;
      const extraction = (
        diagnosis.extraction ||
        payload.extraction ||
        payload.nlp ||
        payload.nlp_result ||
        null
      );
      const trainingHistory = (
        diagnosis.training_history ||
        payload.training_history ||
        null
      );
      return {...diagnosis, extraction, training_history: trainingHistory};
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: {"Content-Type": "application/json"},
        ...options
      });
      const body = await response.json();
      if (!response.ok) {
        throw new Error(body.error || `Request failed with ${response.status}`);
      }
      return body;
    }

    function searchable(value) {
      return String(value || "").trim().toLowerCase();
    }

    function setProblemPanelVisible(isVisible) {
      problemPanel.hidden = !isVisible;
      toggleProblemsButton.textContent = isVisible ? "Hide problems" : "Show problems";
      toggleProblemsButton.setAttribute("aria-expanded", String(isVisible));
    }

    function populateProblemCategories(categories) {
      problemCategory.innerHTML = "";

      const all = document.createElement("option");
      all.value = "";
      all.textContent = "All categories";
      problemCategory.appendChild(all);

      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        problemCategory.appendChild(option);
      });
    }

    function selectProblem(option) {
      selectedProblemId = option.id;
      selectedProblemText = option.text;
      prompt.value = option.text;
      setStatus("Problem selected");
      renderProblemOptions();
      prompt.focus();
    }

    function makeProblemButton(option) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = option.id === selectedProblemId
        ? "problem-option active"
        : "problem-option";
      button.setAttribute("role", "option");
      button.setAttribute("aria-selected", option.id === selectedProblemId ? "true" : "false");

      const category = document.createElement("span");
      category.className = "problem-category";
      category.textContent = option.category;

      const text = document.createElement("span");
      text.className = "problem-text";
      text.textContent = option.text;

      button.append(category, text);
      button.addEventListener("click", () => selectProblem(option));
      button.addEventListener("dblclick", () => form.requestSubmit());
      return button;
    }

    function renderProblemOptions() {
      const query = searchable(problemSearch.value);
      const selectedCategory = problemCategory.value;

      currentProblemMatches = problemOptions.filter((option) => {
        const categoryMatches = !selectedCategory || option.category === selectedCategory;
        const queryMatches = !query || searchable(`${option.category} ${option.text}`).includes(query);
        return categoryMatches && queryMatches;
      });

      problemList.innerHTML = "";
      problemCount.textContent = `${currentProblemMatches.length} of ${problemOptions.length} problems`;

      if (currentProblemMatches.length === 0) {
        const empty = document.createElement("div");
        empty.className = "problem-empty";
        empty.textContent = "No matching problem. Type your own description below.";
        problemList.appendChild(empty);
        return;
      }

      currentProblemMatches.forEach((option) => {
        problemList.appendChild(makeProblemButton(option));
      });
    }

    async function loadProblemOptions() {
      try {
        const payload = await api("/api/problem_options");
        problemOptions = toArray(payload.problems);
        const categories = toArray(payload.categories).length
          ? toArray(payload.categories)
          : [...new Set(problemOptions.map((option) => option.category))];

        populateProblemCategories(categories);
        renderProblemOptions();
      } catch (error) {
        problemCount.textContent = "Problem options are unavailable. You can still type below.";
        problemList.innerHTML = "";
      }
    }

    function toArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function score(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return 0;
      }
      return Math.max(0, Math.min(1, number));
    }

    function makeSection(title) {
      const section = document.createElement("section");
      section.className = "answer-section";

      const heading = document.createElement("h2");
      heading.textContent = title;
      section.appendChild(heading);

      return section;
    }

    function renderChips(values, kind) {
      const row = document.createElement("div");
      row.className = "chip-row";

      if (values.length === 0) {
        const empty = document.createElement("span");
        empty.className = "muted";
        empty.textContent = "None";
        row.appendChild(empty);
        return row;
      }

      values.forEach((value) => {
        const chip = document.createElement("span");
        chip.className = `chip ${kind || ""}`.trim();
        chip.textContent = label(value);
        row.appendChild(chip);
      });

      return row;
    }

    function renderSummary(result) {
      const section = makeSection("Answer");
      const text = document.createElement("p");
      text.className = "summary-text";

      const causes = toArray(result.causes);
      const recommendations = toArray(result.recommendations);
      if (causes.length === 0 && recommendations.length === 0) {
        text.textContent = "I could not derive a rule-backed diagnosis from the recognized facts.";
      } else {
        const causeText = causes.length
          ? `Most likely cause: ${causes.slice(0, 2).map(label).join(", ")}.`
          : "No root cause was derived.";
        const recText = recommendations.length
          ? `Recommended next step: ${label(recommendations[0])}.`
          : "No recommendation was derived.";
        text.textContent = `${causeText} ${recText}`;
      }

      section.appendChild(text);
      return section;
    }

    function renderDiagnosis(result) {
      const section = makeSection("Diagnosis");
      section.appendChild(renderChips(toArray(result.causes), "cause"));
      return section;
    }

    function renderRecommendations(result) {
      const section = makeSection("Recommendations");
      section.appendChild(renderChips(toArray(result.recommendations), "recommendation"));
      return section;
    }

    function renderExtraction(result) {
      if (!result.extraction) {
        return null;
      }

      const extraction = result.extraction || {};
      const section = makeSection("NLP Evidence");
      const facts = (
        toArray(extraction.all_fact_names).length
          ? toArray(extraction.all_fact_names)
          : [
              ...toArray(extraction.symptom_facts),
              ...toArray(extraction.cause_facts),
              ...toArray(extraction.model_type_facts),
              ...toArray(extraction.context_facts)
            ]
      );

      section.appendChild(renderChips(facts, ""));

      const evidence = toArray(extraction.evidence);
      if (evidence.length > 0) {
        const grid = document.createElement("div");
        grid.className = "evidence-grid";

        evidence.forEach((item) => {
          const row = document.createElement("div");
          row.className = "evidence-item";

          const left = document.createElement("div");
          left.textContent = `${label(item.fact_name)} from "${item.phrase || ""}"`;

          const right = document.createElement("div");
          right.className = "muted";
          right.textContent = score(item.confidence).toFixed(3);

          row.append(left, right);
          grid.appendChild(row);
        });

        section.appendChild(grid);
      }

      const negated = toArray(extraction.negated);
      if (negated.length > 0) {
        const negatedFacts = negated.map((item) => item.fact_name || item);
        section.appendChild(renderChips(negatedFacts, "warn"));
      }

      return section;
    }

    function renderTrainingHistory(result) {
      const analysis = result.training_history;
      if (!analysis) {
        return null;
      }

      const section = makeSection("Metric Evidence");
      section.appendChild(renderChips(toArray(analysis.all_fact_names), ""));

      const evidence = toArray(analysis.evidence);
      if (evidence.length > 0) {
        const grid = document.createElement("div");
        grid.className = "evidence-grid";

        evidence.forEach((item) => {
          const row = document.createElement("div");
          row.className = "evidence-item";

          const left = document.createElement("div");
          left.textContent = `${label(item.fact_name)} from ${item.metric || "metrics"}`;

          const right = document.createElement("div");
          right.className = "muted";
          right.textContent = score(item.confidence).toFixed(3);

          row.append(left, right);
          grid.appendChild(row);
        });

        section.appendChild(grid);
      }

      const warnings = toArray(analysis.warnings);
      if (warnings.length > 0) {
        const list = document.createElement("ul");
        list.className = "list";
        warnings.forEach((warning) => {
          const item = document.createElement("li");
          item.textContent = warning;
          list.appendChild(item);
        });
        section.appendChild(list);
      }

      return section;
    }

    function renderConfidence(result) {
      const entries = Object.entries(result.confidence || {})
        .sort(([a], [b]) => a.localeCompare(b));
      if (entries.length === 0) {
        return null;
      }

      const section = makeSection("Confidence");
      const grid = document.createElement("div");
      grid.className = "confidence-grid";

      entries.forEach(([name, value]) => {
        const row = document.createElement("div");
        row.className = "confidence-item";

        const text = document.createElement("div");
        text.textContent = `${label(name)} ${score(value).toFixed(3)}`;

        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("span");
        fill.style.width = `${score(value) * 100}%`;
        bar.appendChild(fill);

        row.append(text, bar);
        grid.appendChild(row);
      });

      section.appendChild(grid);
      return section;
    }

    function renderExplanations(result) {
      const explanations = toArray(result.explanations).slice(0, 5);
      if (explanations.length === 0) {
        return null;
      }

      const section = makeSection("Explanation");
      const list = document.createElement("ul");
      list.className = "list";

      explanations.forEach((exp) => {
        const item = document.createElement("li");
        const triggered = String(exp.triggered_by || "")
          .split(",")
          .map((part) => label(part.trim()))
          .filter(Boolean)
          .join(", ");
        const intro = `${exp.rule_id || "Rule"}: ${label(exp.derived)}`;
        item.textContent = triggered
          ? `${intro} from ${triggered}. ${exp.explanation || ""}`
          : `${intro}. ${exp.explanation || ""}`;
        list.appendChild(item);
      });

      section.appendChild(list);
      return section;
    }

    function renderConflicts(result) {
      const conflicts = toArray(result.conflicts);
      if (conflicts.length === 0) {
        return null;
      }

      const section = makeSection("Conflicts");
      const list = document.createElement("ul");
      list.className = "list";

      conflicts.forEach((conflict) => {
        const item = document.createElement("li");
        const losers = String(conflict.losers || "")
          .split(",")
          .map((part) => label(part.trim()))
          .filter(Boolean)
          .join(", ");
        item.textContent = `${conflict.rule_id || "Rule"} kept ${label(conflict.winner)}; suppressed ${losers || "none"}.`;
        list.appendChild(item);
      });

      section.appendChild(list);
      return section;
    }

    function renderAnswer(rawPayload) {
      const result = normalizeResponse(rawPayload);
      const root = document.createElement("div");
      root.className = "answer";

      [
        renderSummary(result),
        renderDiagnosis(result),
        renderRecommendations(result),
        renderTrainingHistory(result),
        renderExtraction(result),
        renderConfidence(result),
        renderConflicts(result),
        renderExplanations(result)
      ].filter(Boolean).forEach((section) => root.appendChild(section));

      return root;
    }

    function setMode(mode) {
      inputMode = mode;
      modeButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });
      prompt.classList.toggle("hidden", mode !== "text");
      csvPicker.classList.toggle("hidden", mode !== "csv");
      if (mode === "text") {
        prompt.focus();
      } else {
        csvFile.focus();
      }
    }

    async function askText(text) {
      appendMessage("user", text);
      setStatus("Working");
      sendButton.disabled = true;

      try {
        const payload = await api("/api/diagnose_text", {
          method: "POST",
          body: JSON.stringify({text})
        });
        appendMessage("assistant", renderAnswer(payload));
        setStatus("Ready");
      } catch (error) {
        appendMessage("assistant", error.message);
        setStatus(error.message, true);
      } finally {
        sendButton.disabled = false;
        prompt.focus();
      }
    }

    async function askCsv(file) {
      appendMessage("user", `CSV: ${file.name}`);
      setStatus("Working");
      sendButton.disabled = true;

      try {
        const csv = await file.text();
        const payload = await api("/api/diagnose_history", {
          method: "POST",
          body: JSON.stringify({csv, filename: file.name})
        });
        appendMessage("assistant", renderAnswer(payload));
        setStatus("Ready");
      } catch (error) {
        appendMessage("assistant", error.message);
        setStatus(error.message, true);
      } finally {
        sendButton.disabled = false;
        csvFile.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (inputMode === "csv") {
        const file = csvFile.files[0];
        if (!file) {
          setStatus("Select a CSV", true);
          csvFile.focus();
          return;
        }
        askCsv(file);
        return;
      }

      const text = prompt.value.trim();
      if (!text) {
        setStatus("Enter a question", true);
        prompt.focus();
        return;
      }
      prompt.value = "";
      selectedProblemId = "";
      selectedProblemText = "";
      renderProblemOptions();
      ask(text);
    });

    problemSearch.addEventListener("input", renderProblemOptions);
    problemCategory.addEventListener("change", renderProblemOptions);
    toggleProblemsButton.addEventListener("click", () => {
      setProblemPanelVisible(problemPanel.hidden);
    });

    problemSearch.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && currentProblemMatches.length > 0) {
        event.preventDefault();
        selectProblem(currentProblemMatches[0]);
      }
    });

    prompt.addEventListener("input", () => {
      if (selectedProblemId && prompt.value !== selectedProblemText) {
        selectedProblemId = "";
        selectedProblemText = "";
        renderProblemOptions();
      }
    });

    prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    clearButton.addEventListener("click", () => {
      messages.innerHTML = "";
      selectedProblemId = "";
      selectedProblemText = "";
      prompt.value = "";
      problemSearch.value = "";
      problemCategory.value = "";
      renderProblemOptions();
      setStatus("Ready");
      prompt.focus();
    });

    loadProblemOptions();

    clearButton.addEventListener("click", () => {
      messages.innerHTML = "";
      prompt.value = "";
      csvFile.value = "";
      csvName.textContent = "Select CSV";
      setStatus("Ready");
      prompt.focus();
    });

    csvFile.addEventListener("change", () => {
      const file = csvFile.files[0];
      csvName.textContent = file ? file.name : "Select CSV";
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });
  </script>
</body>
</html>
